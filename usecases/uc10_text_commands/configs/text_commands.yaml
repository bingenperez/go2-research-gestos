# uc10 — parametros de las ordenes escritas

acciones:
  # Esperas de Sport Mode tras cada llamada. Las mismas que uc04/uc09.
  espera_standup_s: 3.0
  espera_balance_s: 2.0
  espera_hello_s: 4.0
  espera_stopmove_s: 0.5
  # Tras StandUp, cuanto se espera a que body_height salga del rango de
  # tumbado antes de dar BalanceStand.
  timeout_alto_s: 3.0
  # "Estable" = estado DE_PIE sin interrupcion durante estable_s. Si no se
  # consigue en timeout_estable_s, la orden falla (y no se saluda).
  estable_s: 1.0
  timeout_estable_s: 8.0
  # Al salir: si esta DE_PIE, cuanto se espera como mucho a confirmar que
  # esta estable (estable_s seguidos) para dejarlo de pie. Si no se
  # confirma, cierre seguro (tumbado).
  timeout_estable_cierre_s: 3.0
  # Cuanto se espera a ver SENTADO tras Sit() y TUMBADO tras StandDown().
  timeout_sit_s: 6.0
  timeout_standdown_s: 5.0

seguridad:
  # Sin rt/sportmodestate durante este tiempo el estado es DESCONOCIDO y no se
  # ejecuta ninguna orden.
  estado_max_edad_s: 0.5

estado_robot:
  # Calibrado 2026-11-17 con --estado: el robot da mode 0 en TODAS las
  # posturas, solo las distingue body_height. Medido:
  #   tumbado 0.070 m    sentado 0.228 m    de pie 0.311-0.320 m
  usar_mode: false
  # [min, max] en metros, unos +-0.03 alrededor de lo medido. Una altura fuera
  # de los tres rangos es DESCONOCIDO: son las alturas de paso mientras se
  # levanta, se sienta o se tumba, y no deben confundirse con una postura.
  rangos_altura:
    tumbado: [0.00, 0.12]
    sentado: [0.20, 0.26]
    de_pie: [0.28, 0.36]

  # Solo con usar_mode: true (robots cuyo mode SI distingue posturas). Valores
  # de la documentacion de Unitree para SportModeState.mode:
  #   0 idle, 1 balanceStand, 2 pose, 3 locomotion, 5 lieDown, 6 jointLock,
  #   7 damping, 8 recoveryStand, 10 sit
  modos_de_pie: [1, 3]
  modos_tumbado: [5, 6, 7]
  modos_sentado: [10]
  altura_umbral: 0.20

  # Solo --dry-run: estado inventado con el que arranca (TUMBADO, DE_PIE o
  # SENTADO). Las acciones de mentira lo van cambiando.
  simulado_inicial: TUMBADO
